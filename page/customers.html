          <div class="date">
            <h1>Customer</h1>
            <div class="group-btn">
              <button type="button" class="btn report">Report</button>
              <input
                class="btn btn-date"
                type="date"
                aria-label="Select date"
              />
            </div>
          </div>

          <div class="info-panel">
            <div class="dropdown-group">
              <div class="dropdown status">
                <label for="filter-status">Status</label>
                <select id="filter-status" class="select-box" name="status">
                  <option value="">All</option>
                  <option value="Paid a half">Paid a half</option>
                  <option value="Paid">Paid</option>
                  <option value="Not yet">Not yet</option>
                </select>
              </div>
              <div class="dropdown payment">
                <label for="filter-payment">Payment</label>
                <select id="filter-payment" class="select-box" name="payment">
                  <option value="">All</option>
                  <option value="Cash">Cash</option>
                  <option value="Bank">Bank</option>
                </select>
              </div>
              <div class="dropdown location">
                <label for="filter-location">Location</label>
                <select id="filter-location" class="select-box" name="location">
                  <option value="">All</option>
                  <option value="Hochiminh">Hochiminh</option>
                  <option value="Hanoi">Hanoi</option>
                  <option value="Nha Trang">Nha Trang</option>
                  <option value="Hoi An">Hoi An</option>
                </select>
              </div>
            </div>

            <div class="search-box">
              <label class="visually-hidden" for="customer-search"
                >Search customers</label
              >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1"
                aria-hidden="true"
              >
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
              </svg>
              <input
                id="customer-search"
                class="search-input"
                type="search"
                name="search"
                placeholder="Search..."
              />
            </div>
          </div>

          <div class="table-wrapper">
            <table class="info-customer">
              <thead>
                <tr>
                  <th scope="col">DO</th>
                  <th scope="col">Customer</th>
                  <th scope="col">Product</th>
                  <th scope="col">Volume</th>
                  <th scope="col">Type</th>
                  <th scope="col">Quantity</th>
                  <th scope="col">Price/Unit</th>
                  <th scope="col">Total</th>
                  <th scope="col">
                    <span class="visually-hidden">Actions</span>
                  </th>
                </tr>
              </thead>
              <tbody id="customer-table"></tbody>
            </table>
          </div>

          <button
            type="button"
            class="btn-add"
            id="open-customer-modal"
            aria-label="Add customer"
          >
            <img src="../asset/svg/Subtract.svg" alt="" />
          </button>

          <div
            class="modal-overlay hidden"
            id="customer-modal"
            hidden
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-title"
          >
            <div class="modal">
              <h2 id="modal-title" class="modal-title">Add customer</h2>
              <form class="modal-content" id="customer-form" novalidate>
                <div class="row-1">
                  <div class="cus">
                    <label for="modal-customer">Customer</label>
                    <input
                      id="modal-customer"
                      type="text"
                      name="customer"
                      placeholder="Customer"
                      required
                    />
                  </div>
                  <div class="address">
                    <label for="modal-address">Address</label>
                    <input
                      id="modal-address"
                      type="text"
                      name="address"
                      placeholder="Address"
                    />
                  </div>
                </div>
                <div class="row-2">
                  <div class="phone">
                    <label for="modal-phone">Mobile phone</label>
                    <input
                      id="modal-phone"
                      type="tel"
                      name="phone"
                      placeholder="Mobile phone"
                    />
                  </div>
                  <div class="product">
                    <label for="modal-product">Product</label>
                    <input
                      id="modal-product"
                      type="text"
                      name="product"
                      placeholder="Product"
                    />
                  </div>
                </div>
                <div class="quantity-field">
                  <label for="modal-quantity">Quantity</label>
                  <input
                    id="modal-quantity"
                    type="number"
                    name="quantity"
                    placeholder="Quantity"
                    min="1"
                  />
                </div>
              </form>
              <div class="modal-actions">
                <button
                  type="submit"
                  form="customer-form"
                  class="btn save-btn"
                  id="save-customer"
                >
                  Save and Close
                </button>
                <button
                  type="button"
                  class="btn cancel-btn"
                  id="cancel-customer"
                >
                  Cancel
                </button>
              </div>
            </div>
          </div>

          <div class="total">
            <span>Total:</span>
            <span id="customer-total">0 VND</span>
          </div>
        </div>
      </section>
    </div>
